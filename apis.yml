aid: carlsmed
name: Carlsmed
description: 'Carlsmed (Nasdaq: CARL) is a Carlsbad, California medical technology company
  that builds personalized spine surgery. Its aprevo technology platform combines AI-enabled
  segmentation of a patient''s own imaging with prior-outcomes data to produce a personalized
  surgical plan and patient-specific interbody fusion devices, manufactured on a digital
  production line and delivered to hospitals in under ten days. The platform is FDA-cleared
  for lumbar and cervical indications, holds FDA Breakthrough Device Designation, and
  earned CMS New Technology Add-On Payment status for cervical fusion in 2025. Surgeons
  review, approve and track plans through the myaprevo iOS application. Carlsmed operates
  under ISO 13485 and MDSAP certification and completed its IPO in July 2025. It publishes
  no public developer program, API documentation, or machine-readable API contract.'
